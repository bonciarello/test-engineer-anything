name: TEA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/run-exact-tests.mjs run tests/boundary/filesystem/workflowActionPinning.test.ts
      - run: npm run typecheck
      - run: npm run test:local -- src/teaCore.test.ts src/teaMcp.test.ts src/teaSource.test.ts src/teaQuality.test.ts src/teaArtifact.test.ts
      - run: npm run build:cached
      - run: node scripts/tea.mjs --version
      - run: node scripts/verify-tea-example.mjs
